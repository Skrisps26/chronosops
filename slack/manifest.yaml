# Slack App Manifest for ChronosOps Demo
# Install in development workspace: https://api.slack.com/apps
display_information:
  name: ChronosOps
  description: Graph-grounded incident intelligence and operational memory bot
  background_color: "#1a1e24"

features:
  bot_user:
    display_name: ChronosOps
    always_online: true

oauth_config:
  scopes:
    bot:
      - channels:history
      - chat:write

settings:
  socket_mode_enabled: true
  event_subscriptions:
    bot_events:
      - message.channels
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
