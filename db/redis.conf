# The official FalkorDB entrypoint loads this file through REDIS_ARGS.
# Query timeouts are FalkorDB module arguments (FALKORDB_ARGS), not Redis directives.
port 6379
bind 0.0.0.0
protected-mode no

dir /var/lib/falkordb/data
appendonly yes
appendfsync everysec

# Stored on a separate named volume so ACLs survive a container restart without
# putting plaintext credentials in the image or repository.
aclfile /var/lib/falkordb/acl/users.acl
