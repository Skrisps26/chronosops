[project]
name = "chronosops"
version = "0.1.0"
description = "Local-first graph-grounded incident intelligence"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3==1.43.114",
    "botocore[crt]==1.43.114",
    "fastapi==0.143.3",
    "falkordb==1.8.0",
    "graphrag-sdk[litellm] @ git+https://github.com/FalkorDB/GraphRAG-SDK.git@35e67a0b27fdcc7f2c28508b09e86169851a8187#subdirectory=graphrag_sdk",
    "langchain-aws==1.9.0",
    "langgraph==1.2.15",
    "litellm==1.105.1",
    "mcp==2.3.0",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "torch==2.14.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.hatch.metadata]
allow-direct-references = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
