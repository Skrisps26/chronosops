# Rendered by the official nginx Docker entrypoint from
# /etc/nginx/templates/default.conf.template.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Only Basic Auth identities explicitly issued by bootstrap are tenants. An
# unknown identity is forwarded empty and denied by the application boundary.
map $remote_user $tenant_id {
    acme acme;
    globex globex;
    default "";
}

server {
    listen 8080;
    server_name localhost;

    # User traffic must never reach the Alertmanager-only receiver.
    location = /internal {
        return 403;
    }

    location ^~ /internal/ {
        return 403;
    }

    # Container health checks do not represent an authenticated user request.
    location = /healthz {
        proxy_pass http://app:8000/healthz;
        proxy_set_header X-Tenant-ID "";
        proxy_set_header X-ChronosOps-Proxy-Token "";
        proxy_set_header X-Consumer-Custom-ID "";
    }

    location = /readyz {
        proxy_pass http://app:8000/readyz;
        proxy_set_header X-Tenant-ID "";
        proxy_set_header X-ChronosOps-Proxy-Token "";
        proxy_set_header X-Consumer-Custom-ID "";
    }

    location / {
        auth_basic "ChronosOps Operator Console";
        auth_basic_user_file /run/chronosops/htpasswd;


        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Client values for these headers are never trusted.
        proxy_set_header X-Tenant-ID $tenant_id;
        proxy_set_header X-ChronosOps-Proxy-Token "${CHRONOSOPS_PROXY_TOKEN}";
        proxy_set_header X-Consumer-Custom-ID "";

        # Preserve the WebSocket upgrade path through the authenticated proxy.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
