events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Map authenticated HTTP basic user to tenant ID
    map $remote_user $tenant_id {
        acme acme;
        globex globex;
        default acme;
    }

    server {
        listen 8080;
        server_name localhost;

        # Protect against external access to internal webhook receiver
        location /internal/ {
            return 403 "Forbidden: internal only\n";
        }

        # Health checks bypass auth
        location /healthz {
            proxy_pass http://app:8000/healthz;
        }

        location /readyz {
            proxy_pass http://app:8000/readyz;
        }

        # Main application with basic authentication
        location / {
            auth_basic "ChronosOps Operator Console";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Inject verified tenant header from basic auth identity
            proxy_set_header X-Tenant-ID $tenant_id;

            # WebSocket upgrade support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
