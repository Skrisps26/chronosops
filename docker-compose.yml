name: chronosops

services:
  db:
    build:
      context: ./db
    env_file:
      - ./.secrets/db.env
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      # The official image writes RDB/AOF files here.
      - falkordb-data:/var/lib/falkordb/data
      # ACLs are generated from ignored secrets and survive a DB restart.
      - falkordb-acl:/var/lib/falkordb/acl
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(REDISCLI_AUTH=\"$$FALKORDB_ADMIN_PASSWORD\" redis-cli --raw --user admin PING)\" = PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # Module 0 intentionally runs only the real dependency probe. Later modules
  # replace the command with the API; this is not a placeholder HTTP service.
  app:
    build:
      context: .
    env_file:
      - ./.env
      - ./.secrets/db.env
    environment:
      FALKORDB_HOST: db
      FALKORDB_PORT: "6379"
      # Container credential file locations when mounted
      AWS_SHARED_CREDENTIALS_FILE: /run/aws/credentials
      AWS_CONFIG_FILE: /run/aws/config
    depends_on:
      db:
        condition: service_healthy
    init: true

volumes:
  falkordb-data:
  falkordb-acl:
