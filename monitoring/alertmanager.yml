global:
  resolve_timeout: 1m

route:
  group_by: ["alertname", "service"]
  group_wait: 0s
  group_interval: 5s
  repeat_interval: 5m
  receiver: "chronosops_webhook"

receivers:
  - name: "chronosops_webhook"
    webhook_configs:
      - url: "http://app:8000/internal/alerts"
        send_resolved: true
        http_config:
          bearer_token: "demo-internal-alert-secret"
